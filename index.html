<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>

<body class="py-5">
  <div class="container">
    <h2 id="page-title" class="mb-4 text-center"></h2>

    <div id="file-list" class="list-group shadow-sm"></div>
    <div id="status" class="mt-3 text-center"></div>
  </div>

  <script src="config.js"></script>

  <script>
    document.title = siteConfig.siteTitle;

    if (siteConfig.fontImport) {
      const fontLink = document.createElement("link");
      fontLink.rel = "stylesheet";
      fontLink.href = siteConfig.fontImport;
      document.head.appendChild(fontLink);
    }

    document.body.style.backgroundColor = siteConfig.backgroundColor;
    document.body.style.backgroundImage = siteConfig.backgroundImage
      ? `url("${siteConfig.backgroundImage}")`
      : "none";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundAttachment = "fixed";
    document.body.style.color = siteConfig.textColor;
    document.body.style.fontFamily = siteConfig.fontFamily;

    document.getElementById("page-title").textContent = siteConfig.pageTitle;
    document.getElementById("page-title").style.color = siteConfig.titleColor;

    // add date for cache busting to not need to hard refresh after each update
    fetch(`files/files.json?v=${Date.now()}`)
      .then(r => r.json())
      .then(files => {
        const list = document.getElementById("file-list");

        files.forEach(bundle => {
          const filename = `${bundle.slug}.zip`;
          const item = document.createElement("div");
          item.className = "list-group-item d-flex justify-content-between align-items-center";

          const content = document.createElement("div");

          const name = document.createElement("div");
          name.className = "fw-semibold";
          name.textContent = bundle.name;

          const description = document.createElement("div");
          description.className = "text-secondary small";
          description.textContent = bundle.description;

          const button = document.createElement("button");
          button.className = "btn btn-sm";
          button.style.border = `1px solid ${siteConfig.accentColor}`;
          button.style.color = siteConfig.accentColor;
          button.innerHTML = '<i class="fa-solid fa-clipboard"></i>';
          button.onclick = () => copyLink(filename, button);

          content.appendChild(name);
          content.appendChild(description);

          item.appendChild(content);
          item.appendChild(button);
          list.appendChild(item);
        });
    });

    function copyLink(filename, button) {
      const subdirectory = "files";
      let base = `${window.location.origin}${window.location.pathname.replace(/\/index\.html$/, '')}`;
      base = base.replace(/\/+$/, '');
      const encodedName = encodeURIComponent(filename);
      const url = `${base}/${subdirectory}/${encodedName}`;
      
      navigator.clipboard.writeText(url).then(() => {
        const status = document.getElementById("status");
        status.textContent = `Copied: ${url}`;
        status.style.color = siteConfig.successColor;

        button.innerHTML = '<i class="fa-solid fa-check"></i>';
        button.style.color = siteConfig.successColor;

        setTimeout(() => {
          status.textContent = "";
          button.innerHTML = '<i class="fa-solid fa-clipboard"></i>';
          button.style.color = siteConfig.accentColor;
        }, 4000);
      });
    }
  </script>
</body>
</html>
